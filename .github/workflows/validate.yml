name: validate

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  repo-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate repository structure
        run: python scripts/validate_repo.py
      - name: Run learning path helper
        run: python scripts/learning_path.py
      - name: Run labs
        run: |
          python 01_donanim_sensor/labs/imu_complementary_filter.py
          python 02_edge_ai_performans/labs/latency_budget.py
          python 02_edge_ai_performans/labs/foveated_tile_planner.py
          python 03_yazilim_matematik_pipeline/labs/quaternion_playground.py
          python 04_ag_guvenlik/labs/udp_snapshot_packet.py
